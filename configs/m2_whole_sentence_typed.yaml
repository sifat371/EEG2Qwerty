schema_version: 2
name: m2_whole_sentence_typed_baseline
status: candidate

upstream:
  repository: https://github.com/facebookresearch/brain2qwerty
  commit: 5f9889621d0df391c5aab37c996683d308e6e926

protocol:
  dataset: SpanishBCBL
  modality: EEG
  alignment: keypress
  target: typed_key
  sentence_batching: whole_sentence
  external_language_model: false
  # Set to null to reproduce the current released-code typed-key event set.
  # Set to 10 for the paper-stated typographical-error sentence filter.
  max_typographical_errors: null

window:
  start_seconds: -0.2
  duration_seconds: 0.5
  resample_hz: 50
  bandpass_hz: [0.1, 20.0]

model:
  historical_family: M2
  width: 192
  encoder_blocks: 6
  transformer_layers: 2
  transformer_heads: 2
  transformer_ff: 512
  encoder_dropout: 0.25
  transformer_dropout: 0.30

training:
  seed: 33
  epochs: 60
  patience: 12
  train_batch_keystrokes: 256
  eval_batch_keystrokes: 512
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip: 1.0

report:
  primary_metric: participant_mean_cer
  additional_metrics:
    - pooled_cer
    - participant_median_cer
    - participant_sd_cer
    - parameter_count
    - peak_vram
    - training_time
